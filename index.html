<style>
body{

}

.container{
  max-width:900px;

}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{

}

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG UNIT 1 ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
  {
    q: "Although the enemy army was much larger, the local people continued to _______ their attacks for several months.",

    c: 1
  },
  {
    q: "Thousands of ordinary people joined the _______ movement to fight against the occupying forces.",

  },
  {

  },
  {
    q: "The two armies fought a fierce _______ that lasted from early morning until sunset.",
    a: ["mission", "battle", "treatment", "legacy"],
    c: 1
  },
  {
    q: "Many wounded soldiers were carried away from the _______ and taken to a nearby field hospital.",
    a: ["battlefield", "documentary", "surgery", "biography"],
    c: 0
  },
  {
    q: "The resistance fighters often hid deep in the _______, where enemy forces found it difficult to locate them.",
    a: ["operation", "jungle", "presentation", "character"],
    c: 1
  },
  {
    q: "The _______ ordered his troops to move to a safer position after receiving reports of an approaching enemy force.",
    a: ["entrepreneur", "surgeon", "commander", "poet"],
    c: 2
  },
  {
    q: "After years of military service and several major battles, he is now respected as a war _______.",
    a: ["veteran", "founder", "genius", "character"],
    c: 0
  },
  {
    q: "The young _______ was seriously wounded while protecting his unit during the battle.",
    a: ["soldier", "entrepreneur", "surgeon", "poet"],
    c: 0
  },
  {
    q: "When it became impossible to defend the position, the commander had no choice but to order a _______.",
    a: ["victory", "mission", "retreat", "resistance"],
    c: 2
  },
  {
    q: "Because of his important contribution to the country's independence, he later became known as a national _______.",
    a: ["hero", "enemy", "founder", "surgeon"],
    c: 0
  },
  {
    q: "The soldiers were remembered for their _______ actions in protecting civilians despite the danger to their own lives.",
    a: ["viral", "heroic", "biological", "poetic"],
    c: 1
  },
  {
    q: "The commander successfully led his army to _______ after several months of difficult fighting.",
    a: ["injury", "victory", "retreat", "disease"],
    c: 1
  },
  {
    q: "The rescue team was sent on a dangerous _______ to bring the wounded soldiers back from enemy territory.",
    a: ["achievement", "vision", "mission", "recreation"],
    c: 2
  },
  {
    q: "Her lifelong _______ to helping injured soldiers made her widely respected by both doctors and patients.",
    a: ["devotion", "resistance", "operation", "animation"],
    c: 0
  },
  {
    q: "Even under extremely difficult conditions, she remained _______ to providing medical care for everyone who needed it.",
    a: ["dedicated", "viral", "wounded", "computer-animated"],
    c: 0
  },
  {
    q: "He decided to _______ his entire life to scientific research and the improvement of public health.",
    a: ["diagnose", "dedicate", "retreat", "characterize"],
    c: 1
  },
  {
    q: "Her strong _______ to achieve her goal helped her overcome many difficulties and complete the project successfully.",
    a: ["determination", "battlefield", "defeat", "treatment"],
    c: 0
  },
  {
    q: "She was _______ to complete the mission successfully, even though the conditions were extremely challenging.",
    a: ["determined", "poetic", "biological", "wounded"],
    c: 0
  },
  {
    q: "The community showed remarkable _______ by rebuilding homes and schools soon after the war ended.",
    a: ["resilience", "surgery", "biography", "presentation"],
    c: 0
  },
  {
    q: "It took great courage and _______ for the team to continue the project after many unsuccessful attempts.",
    a: ["perseverance", "animation", "injury", "battlefield"],
    c: 0
  },
  {
    q: "The firefighter showed extraordinary _______ when he entered the burning building to rescue two children.",
    a: ["courage", "poetry", "disease", "treatment"],
    c: 0
  },
  {
    q: "People throughout the country admired the soldier's _______ in facing danger to protect others.",
    a: ["bravery", "recreation", "operation", "presentation"],
    c: 0
  },
  {
    q: "His willingness to sacrifice his personal interests for his country reflected a deep sense of _______.",
    a: ["patriotism", "innovation", "surgery", "animation"],
    c: 0
  },
  {
    q: "Her strong _______ to the humanitarian cause continued for more than thirty years.",
    a: ["commitment", "defeat", "injury", "battlefield"],
    c: 0
  },
  {
    q: "The leader had a clear _______ of a country in which all children would have access to education.",
    a: ["vision", "retreat", "enemy", "treatment"],
    c: 0
  },
  {
    q: "Steve Jobs is often described as a _______ entrepreneur because he imagined products and technologies before they became common.",
    a: ["wounded", "visionary", "viral", "poetic"],
    c: 1
  },
  {
    q: "During the war, the doctor spent several years working in a _______ close to the battlefield.",
    a: ["field hospital", "resistance movement", "live-action film", "personal account"],
    c: 0
  },
  {
    q: "The _______ performed several difficult operations on wounded soldiers during the night.",
    a: ["founder", "fighter", "surgeon", "commander"],
    c: 2
  },
  {
    q: "Because the soldier had a serious abdominal injury, doctors had to perform emergency _______ immediately.",
    a: ["surgery", "poetry", "animation", "resistance"],
    c: 0
  },
  {
    q: "The doctor had to _______ on the wounded soldier for nearly four hours to remove the bullet safely.",
    a: ["innovate", "operate", "resist", "inspire"],
    c: 1
  },
  {
    q: "Nurses worked day and night to _______ the injured after the battle.",
    a: ["transform", "characterize", "treat", "dedicate"],
    c: 2
  },
  {
    q: "The patient received medical _______ for several weeks before he was well enough to leave the hospital.",
    a: ["treatment", "commitment", "achievement", "innovation"],
    c: 0
  },
  {
    q: "After several medical tests, he was _______ with pancreatic cancer.",
    a: ["presented", "defeated", "diagnosed", "inspired"],
    c: 2
  },
  {
    q: "The company developed a highly _______ method that reduced production time by almost half.",
    a: ["innovative", "heroic", "wounded", "viral"],
    c: 0
  },
  {
    q: "The laboratory uses _______ technology that is more advanced than most systems currently available.",
    a: ["national", "cutting-edge", "poetic", "wounded"],
    c: 1
  },
  {
    q: "The invention of smartphones helped _______ the way people communicate, work, and access information.",
    a: ["retreat", "diagnose", "revolutionize", "characterize"],
    c: 2
  },
  {
    q: "The filmmaker used computer _______ to create characters and environments that would have been impossible to film in real life.",
    a: ["animation", "resistance", "perseverance", "treatment"],
    c: 0
  },
  {
    q: "In her autobiography, she gives a detailed _______ of her experiences working as a doctor during the war.",
    a: ["personal account", "battlefield injury", "military commander", "technological innovation"],
    c: 0
  },
  {
    q: "In the novel, the author _______ the main character as a brave but deeply conflicted young soldier.",
    a: ["operates", "characterizes", "retreats", "diagnoses"],
    c: 1
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>
