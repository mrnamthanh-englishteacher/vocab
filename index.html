<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>✨ KHẢO BÀI TỪ VỰNG ✨</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#ffe6f0,#e0f7fa);
  margin:0;padding:0;
}

.container{
  max-width:900px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

h1{
  text-align:center;
  color:#ff4da6;
}

.header{
  text-align:center;
  margin-bottom:15px;
}

#username{
  padding:10px;
  border-radius:20px;
  border:1px solid #ccc;
  width:60%;
  text-align:center;
}

#timer{
  text-align:center;
  font-size:18px;
  margin:10px;
}

.question{
  background:#f9f9f9;
  padding:12px;
  margin-bottom:10px;
  border-radius:12px;
}

.unanswered{
  border:2px solid red;
  background:#fff0f0;
}

.answers label{
  display:block;
  margin:5px 0;
  cursor:pointer;
}

button{
  display:block;
  margin:20px auto;
  padding:12px 25px;
  border:none;
  border-radius:25px;
  background:#ff4da6;
  color:#fff;
  font-size:16px;
  cursor:pointer;
}

#result{
  margin-top:20px;
}

#leaderboard{
  margin-top:10px;
}

.quiz-locked{
  opacity:0.55;
  pointer-events:none;
}

#nameHint{
  text-align:center;
  color:#c00000;
  font-weight:bold;
  margin-top:8px;
}
</style>
</head>

<body oncontextmenu="return false;">

<div class="container">

<h1>✨ KHẢO BÀI TỪ VỰNG  ✨</h1>

<div class="header">
<input id="username" placeholder="Nhập tên của bạn...">
<div id="nameHint">⚠️ Phải nhập tên trước khi làm bài.</div>
</div>

<div id="timer">⏳ 20:00</div>

<div id="quiz"></div>

<button onclick="submitQuiz()">Nộp bài</button>

<div id="result"></div>

<h3>🏆 Bảng xếp hạng</h3>
<div id="leaderboard"></divầy 
</div>

<script>
let tabSwitchCount = 0;
let submitted = false;
let timeExpired = false; 

document.addEventListener("visibilitychange", function() {
  if (document.hidden) {
    tabSwitchCount++;

    alert("⚠️ Bạn đã rời tab (" + tabSwitchCount + " lần)");

    if(tabSwitchCount >= 3){
      alert("❌ Bạn rời tab quá nhiều!");
      submitQuiz();
    }
  }
});

// 🔀 random
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

// 📚 DATA
let originalQuestions = [
   {
    q: "Marie Curie ______ extensive research on radioactivity, which earned her international recognition.",
    a: ["carried out", "turned down", "gave up", "put off"],
    c: 0
  },
  {
    q: "After several months of fighting, the national army finally ______ the invading forces and regained control of the city.",
    a: ["admired", "defeated", "protected", "surrendered"],
    c: 1
  },
  {
    q: "The hospital has introduced ______ medical equipment that allows doctors to perform complex operations with greater precision.",
    a: ["ancient", "ordinary", "cutting-edge", "outdated"],
    c: 2
  },
  {
    q: "The young scientist was widely regarded as a ______ because she solved difficult mathematical problems at the age of eight.",
    a: ["surgeon", "genius", "soldier", "character"],
    c: 1
  },
  {
    q: "The rescue team continued its ______ against the enemy despite severe shortages of food and medical supplies.",
    a: ["ambition", "devotion", "resistance", "confusion"],
    c: 2
  },
  {
    q: "During the war, many wounded soldiers received emergency treatment at temporary ______ built near the battlefield.",
    a: ["field hospitals", "pizza chains", "cultural centres", "research laboratories"],
    c: 0
  },
  {
    q: "The experienced ______ performed an emergency operation to save the soldier who had been seriously injured.",
    a: ["poet", "surgeon", "historian", "journalist"],
    c: 1
  },
  {
    q: "Although he was offered a well-paid job abroad, the doctor remained ______ to serving people in his hometown.",
    a: ["unfamiliar", "offensive", "committed", "contaminated"],
    c: 2
  },
  {
    q: "The author gave a detailed personal ______ of her experiences during the resistance war in her autobiography.",
    a: ["account", "figure", "custom", "feature"],
    c: 0
  },
  {
    q: "The historical film became a ______, earning millions of dollars and attracting huge audiences worldwide.",
    a: ["documentary", "blockbuster", "phonograph", "short film"],
    c: 1
  },
  {
    q: "Despite facing numerous difficulties, she remained ______ to achieve her dream of becoming a successful scientist.",
    a: ["unenthusiastic", "unfamiliar", "ambitious", "insulting"],
    c: 2
  },
  {
    q: "After studying engineering for two years, he decided to ______ university and start his own technology company.",
    a: ["carry out", "pass away", "bond over", "drop out of"],
    c: 3
  },
  {
    q: "Students from different countries may experience ______ when they first encounter unfamiliar customs and social rules.",
    a: ["cultural diversity", "culture shock", "cultural exchange", "social justice"],
    c: 1
  },
  {
    q: "International exchange programmes encourage students to respect ______ by introducing them to different languages, religions and traditions.",
    a: ["cultural diversity", "language barriers", "plastic waste", "social divisions"],
    c: 0
  },
  {
    q: "The international students found it difficult to communicate with local residents because of the ______.",
    a: ["traditional costumes", "cultural features", "language barrier", "sense of identity"],
    c: 2
  },
  {
    q: "It is important to ______ other cultures instead of judging their traditions according to our own standards.",
    a: ["overlook", "appreciate", "insult", "disregard"],
    c: 1
  },
  {
    q: "In some cultures, pointing directly at an older person may be considered ______ because it shows a lack of respect.",
    a: ["respectful", "appropriate", "offensive", "ordinary"],
    c: 2
  },
  {
    q: "The festival attracts international visitors because it ______ traditional music with modern dance performances.",
    a: ["separates", "removes", "blends", "replaces"],
    c: 2
  },
  {
    q: "The local government's efforts to preserve traditional festivals help residents maintain a strong ______ of identity.",
    a: ["feature", "sense", "element", "contrast"],
    c: 1
  },
  {
    q: "Vietnamese dishes such as pho and banh mi have ______ popularity in many countries around the world.",
    a: ["made", "taken", "gained", "done"],
    c: 2
  },
  {
    q: "The restaurant serves a wide variety of dishes, but its seafood noodles are the local ______ that most tourists come to try.",
    a: ["respect", "element", "speciality", "confusion"],
    c: 2
  },
  {
    q: "The spicy soup does not suit my ______ because I prefer mild dishes without chilli.",
    a: ["taste", "identity", "respect", "characteristic"],
    c: 0
  },
  {
    q: "The chef opened a successful restaurant ______, with more than fifty branches operating throughout the country.",
    a: ["booth", "chain", "layer", "pile"],
    c: 1
  },
  {
    q: "The beauty of the traditional dance performance ______ the audience, who watched silently until the final movement.",
    a: ["contaminated", "captivated", "decomposed", "defeated"],
    c: 1
  },
  {
    q: "If we want to reduce household waste, we should ______ single-use plastic bags and replace them with reusable shopping bags.",
    a: ["make use of", "carry out", "get rid of", "bond over"],
    c: 2
  },
  {
    q: "Plastic bottles can remain in the environment for hundreds of years because they do not ______ easily.",
    a: ["decompose", "recycle", "produce", "contain"],
    c: 0
  },
  {
    q: "Before putting an empty milk carton into the recycling bin, you should ______ it with clean water to remove any remaining milk.",
    a: ["throw away", "rinse out", "rush out", "work out"],
    c: 1
  },
  {
    q: "After the family dinner, we placed the ______ in the refrigerator so that we could eat them the following day.",
    a: ["peels", "layers", "leftovers", "fertilizers"],
    c: 2
  },
  {
    q: "Farmers who use excessive amounts of ______ may cause serious damage to soil and nearby water sources.",
    a: ["compost piles", "reusable containers", "chemical fertilizers", "vegetable peels"],
    c: 2
  },
  {
    q: "The river became seriously ______ after a nearby factory released untreated industrial wastewater into it.",
    a: ["purified", "protected", "contaminated", "recycled"],
    c: 2
  },
  {
    q: "To reduce food waste, the restaurant allows customers to order smaller portions or take their meals home in ______ containers.",
    a: ["takeaway", "medical", "electrical", "historical"],
    c: 0
  },
  {
    q: "Students are encouraged to ______ old newspapers for art projects instead of throwing them into the rubbish bin.",
    a: ["get rid of", "make use of", "drop out of", "pass away"],
    c: 1
  },
  {
    q: "The environmental club organises clean-up activities ______, usually on the first Saturday of every month.",
    a: ["rarely", "accidentally", "regularly", "immediately"],
    c: 2
  },
  {
    q: "Residents are asked to separate recyclable materials from food waste ______ so that the local recycling system can operate effectively.",
    a: ["carelessly", "properly", "rarely", "suddenly"],
    c: 1
  },
  {
    q: "The school has launched a campaign to encourage students to ______ plastic bottles instead of throwing them away after a single use.",
    a: ["contaminate", "decompose", "reuse", "defeat"],
    c: 2
  }
];


// 🔀 RANDOM CÂU + ĐÁP ÁN
let questions = shuffle(originalQuestions.map(q=>{
  let opts = q.a.map((t,i)=>({t,correct:i===q.c}));
  opts = shuffle(opts);
  return {
    q:q.q,
    a:opts.map(o=>o.t),
    c:opts.findIndex(o=>o.correct)
  };
}));

// render
const quizDiv=document.getElementById("quiz");

questions.forEach((q,i)=>{
  let div=document.createElement("div");
  div.className="question";

  let html=`${i+1}. ${q.q}`;

  q.a.forEach((ans,idx)=>{
    html+=`
    <div class="answers">
      <label>
        <input type="radio" name="q${i}" value="${idx}">
        ${String.fromCharCode(65+idx)}. ${ans}
      </label>
    </div>`;
  });

  div.innerHTML=html;
  quizDiv.appendChild(div);
});

// 🔒 BẮT BUỘC NHẬP TÊN TRƯỚC KHI LÀM BÀI
const usernameInput = document.getElementById("username");
const nameHint = document.getElementById("nameHint");

function setQuizAccess(){
  const hasName = usernameInput.value.trim().length > 0;
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>{
    input.disabled = !hasName || submitted || timeExpired;
  });
  quizDiv.classList.toggle("quiz-locked", !hasName && !submitted);
  nameHint.style.display = hasName ? "none" : "block";
}

usernameInput.addEventListener("input", setQuizAccess);
setQuizAccess();

// ⏱ timer
let time=1200;
let timer=setInterval(()=>{
  let m=Math.floor(time/60);
  let s=time%60;
  document.getElementById("timer").innerText=`⏳ ${m}:${s<10?"0"+s:s}`;
  time--;
  if(time<0){
    clearInterval(timer);
    timeExpired = true;
    submitQuiz(true);
  }
},1000);

// submit
function submitQuiz(forceSubmit=false){
  if(submitted) return;

  let name=document.getElementById("username").value.trim();
  if(!name){
    if(forceSubmit){
      name = "CHƯA NHẬP TÊN";
    }else{
      alert("❌ Bạn phải nhập tên trước khi làm và nộp bài!");
      usernameInput.focus();
      return;
    }
  }
let hasEmpty = false;

// kiểm tra câu chưa làm
questions.forEach((q,i)=>{
  let selected=document.querySelector(`input[name=q${i}]:checked`);
  let div=document.getElementsByClassName("question")[i];

  div.classList.remove("unanswered");

  if(!selected){
    div.classList.add("unanswered");
    hasEmpty = true;
  }
});

if(hasEmpty && !forceSubmit){
  alert("❌ Bạn phải làm hết câu trước khi nộp!");
  return;
}
  clearInterval(timer);
  submitted = true;

  // 🔒 Khóa toàn bộ bài sau khi nộp / hết giờ
  document.querySelectorAll('#quiz input[type="radio"]').forEach(input=>input.disabled=true);
  usernameInput.disabled = true;
  quizDiv.classList.remove("quiz-locked");
  const submitBtn = document.querySelector('button[onclick="submitQuiz()"]');
  if(submitBtn){
    submitBtn.disabled = true;
    submitBtn.style.opacity = "0.55";
    submitBtn.style.cursor = "not-allowed";
    submitBtn.innerText = timeExpired ? "⏰ Đã hết giờ - Bài đã tự nộp" : "✅ Đã nộp bài";
  }

  let score=0;
  let wrongList=[];

  questions.forEach((q,i)=>{
    let selected=document.querySelector(`input[name=q${i}]:checked`);
    if(!selected)return;

    let val=parseInt(selected.value);

    if(val===q.c){
      score++;
    } else {
      wrongList.push({
        question:q.q,
        your:String.fromCharCode(65+val)+". "+q.a[val],
        correct:String.fromCharCode(65+q.c)+". "+q.a[q.c]
      });
    }
  });

  // ⭐ TIME
  let now = new Date().toLocaleString();

  // hiển thị
  let wrongRate = wrongList.length / questions.length;

let resultHTML = `
🎉 <b>${name}</b> đúng <b>${score}/${questions.length}</b><br>
⏰ ${now}<br>
⚠️ TabSwitch: ${tabSwitchCount || 0}<br>
${timeExpired ? "⏰ <b>Hết thời gian: hệ thống đã tự động nộp và khóa bài.</b><br>" : ""}<br>
`;

if(wrongRate < 0.3){

    resultHTML += `
    <h3>📚 Đáp án các câu sai</h3>
    `;

    wrongList.forEach((w,i)=>{
        resultHTML += `
        <div style="
            border:1px solid #ddd;
            padding:10px;
            margin-bottom:10px;
            border-radius:10px;
            background:#fff8e6;
        ">
            <b>Câu ${i+1}</b><br>
            ${w.question}<br><br>

            ❌ Bạn chọn: <span style="color:red">${w.your}</span><br>
            ✅ Đáp án: <span style="color:green">${w.correct}</span>
        </div>
        `;
    });

}else{

    resultHTML += `
    <div style="
        background:#ffeaea;
        padding:15px;
        border-radius:12px;
        color:#c00000;
        font-weight:bold;
    ">
    ❌ Sai trên 30% mà đòi mấy đáp án của mẹ hả cưng?<br>
    Học bài kỹ vô bữa sau mẹ khảo lại!
    </div>
    `;
}

document.getElementById("result").innerHTML = resultHTML;

  // ⭐ GỬI DATA FULL
  fetch("https://script.google.com/macros/s/AKfycbwKGHpjJy1RxNpGRIHdZtQiPfCrh0OSG24DEzQtRB7Ezlr1aki97aZL0JfQiSwkKmYmrg/exec",{
    method:"POST",
    body:JSON.stringify({
      time: now,
      name: name,
      score: score,
      total: questions.length,
      tabSwitch: tabSwitchCount || 0,
      wrong: wrongList.map((w,i)=>
        (i+1)+". "+w.question+
        " | Bạn chọn: "+w.your+
        " | Đúng: "+w.correct
      ).join("\n")
    })
  });
}

</script>

</body>
</html>
